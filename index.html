    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              fancy: ['"Dancing Script"', 'cursive'],
            },
            colors: {
              'primary': '#6366f1', // Indigo 500
              'primary-dark': '#4f46e5', // Indigo 600
              'secondary': '#14b8a6', // Teal 500
              'secondary-dark': '#0d9488', // Teal 600
              'faculty-primary': '#16a34a', // Green 600
              'faculty-primary-dark': '#15803d', // Green 700
              'faculty-sidebar': '#14532d', // Dark Green 900
              'light-bg': '#f8fafc', // Slate 50
              'content': '#64748b', // Slate 500
              'heading': '#1e293b', // Slate 800
              'dark-bg': '#0f172a', // Slate 900
              'dark-sidebar': '#1e293b', // Slate 800
              'border': '#e2e8f0', // Slate 200
              'dark-border': '#334155', // Slate 700
            }
          }
        }
      }
    </script>
    <style>
      /* Main Custom Scrollbar Styles */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background-color: #f1f5f9; /* slate-100 */
      }
      ::-webkit-scrollbar-thumb {
        background-color: #cbd5e1; /* slate-300 */
        border-radius: 10px;
        border: 2px solid #f1f5f9; /* Creates padding around thumb */
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: #94a3b8; /* slate-400 */
      }
      /* Firefox */
      html {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 #f1f5f9;
      }

      /* Utility: Hide scrollbar */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      /* Utility: Minimal scrollbar for small areas like notes */
      .note-content-scrollbar::-webkit-scrollbar { width: 5px; }
      .note-content-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .note-content-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
      .note-content-scrollbar { scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.2) transparent; }
    </style>
